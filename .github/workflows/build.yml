name: Build patched Facebook

on:
  schedule:
    - cron: '0 4 * * *'   # daily probe, 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this release already exists
        type: boolean
        default: false
      expert:
        description: 'Also enable AMOLED black theme, Material You theme, Disable Play Store updates'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Probe upstream versions
        id: probe
        env:
          FORCE: ${{ inputs.force == true }}
          EXPERT: ${{ inputs.expert == true }}
        run: bash scripts/probe.sh

      - name: Download Facebook APK
        if: steps.probe.outputs.need_build == 'true'
        id: fetch
        run: bash scripts/fetch-apk.sh "${{ steps.probe.outputs.fb_version }}"

      - name: Patch
        if: steps.probe.outputs.need_build == 'true'
        id: patch
        env:
          EXPERT: ${{ inputs.expert == true }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash scripts/patch.sh "${{ steps.probe.outputs.fb_version }}" "${{ steps.probe.outputs.hush_tag }}" "${{ steps.fetch.outputs.apk }}"

      - name: Upload artifact
        if: steps.probe.outputs.need_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-patched
          path: ${{ steps.patch.outputs.out }}
          retention-days: 90
          if-no-files-found: error

      - name: Create release
        if: steps.probe.outputs.need_build == 'true'
        env:
          RELEASE_TAG: ${{ steps.probe.outputs.release_tag }}
          EXPERT: ${{ inputs.expert == true }}
          FORCE: ${{ inputs.force == true }}
        run: bash scripts/release.sh "${{ steps.probe.outputs.fb_version }}" "${{ steps.probe.outputs.hush_tag }}" "${{ steps.patch.outputs.out }}"
