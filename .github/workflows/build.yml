name: Build patched Facebook

on:
  schedule:
    - cron: '0 4 * * *'   # daily probe, 04:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this release already exists
        type: boolean
        default: false
      expert:
        description: 'Add all three expert patches to default set: AMOLED black theme, Material You theme, Disable Play Store updates'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Probe upstream versions
        id: probe
        env:
          FORCE: ${{ inputs.force == true }}
          EXPERT: ${{ inputs.expert == true }}
        run: bash scripts/probe.sh

      - name: Download Facebook APK
        if: steps.probe.outputs.need_build == 'true'
        id: fetch
        run: bash scripts/fetch-apk.sh "${{ steps.probe.outputs.fb_version }}"

      - name: Patch default
        if: steps.probe.outputs.need_build == 'true' && inputs.expert != true
        id: patch_default
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash scripts/patch.sh "${{ steps.probe.outputs.fb_version }}" "${{ steps.probe.outputs.hush_tag }}" "${{ steps.fetch.outputs.apk }}"

      - name: Patch default + AMOLED
        if: steps.probe.outputs.need_build == 'true' && inputs.expert != true
        id: patch_amoled
        env:
          AMOLED: 'true'
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash scripts/patch.sh "${{ steps.probe.outputs.fb_version }}" "${{ steps.probe.outputs.hush_tag }}" "${{ steps.fetch.outputs.apk }}"

      - name: Patch default + Material You
        if: steps.probe.outputs.need_build == 'true' && inputs.expert != true
        id: patch_material_you
        env:
          MATERIAL_YOU: 'true'
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash scripts/patch.sh "${{ steps.probe.outputs.fb_version }}" "${{ steps.probe.outputs.hush_tag }}" "${{ steps.fetch.outputs.apk }}"

      - name: Patch expert
        if: steps.probe.outputs.need_build == 'true' && inputs.expert == true
        id: patch_expert
        env:
          EXPERT: 'true'
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash scripts/patch.sh "${{ steps.probe.outputs.fb_version }}" "${{ steps.probe.outputs.hush_tag }}" "${{ steps.fetch.outputs.apk }}"

      - name: Upload variants artifact
        if: steps.probe.outputs.need_build == 'true' && inputs.expert != true
        uses: actions/upload-artifact@v4
        with:
          name: facebook-patched
          path: |
            ${{ steps.patch_default.outputs.out }}
            ${{ steps.patch_amoled.outputs.out }}
            ${{ steps.patch_material_you.outputs.out }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload expert artifact
        if: steps.probe.outputs.need_build == 'true' && inputs.expert == true
        uses: actions/upload-artifact@v4
        with:
          name: facebook-patched
          path: ${{ steps.patch_expert.outputs.out }}
          retention-days: 90
          if-no-files-found: error

      - name: Create release
        if: steps.probe.outputs.need_build == 'true'
        env:
          RELEASE_TAG: ${{ steps.probe.outputs.release_tag }}
          FB_VERSION: ${{ steps.probe.outputs.fb_version }}
          HUSH_TAG: ${{ steps.probe.outputs.hush_tag }}
          APK_DEFAULT: ${{ steps.patch_default.outputs.out }}
          APK_AMOLED: ${{ steps.patch_amoled.outputs.out }}
          APK_MATERIAL_YOU: ${{ steps.patch_material_you.outputs.out }}
          APK_EXPERT: ${{ steps.patch_expert.outputs.out }}
          EXPERT: ${{ inputs.expert == true }}
          FORCE: ${{ inputs.force == true }}
        run: |
          if [ "$EXPERT" = "true" ]; then
            bash scripts/release.sh "$FB_VERSION" "$HUSH_TAG" "$APK_EXPERT"
          else
            bash scripts/release.sh "$FB_VERSION" "$HUSH_TAG" "$APK_DEFAULT" "$APK_AMOLED" "$APK_MATERIAL_YOU"
          fi
